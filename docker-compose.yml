services:
  db:
    container_name: ${CONTAINER_NAME:-hiker-postgres}
    build: .
    image: postgres:18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - hiker-pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  hiker-pgdata:
